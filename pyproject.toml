[project]
name = "ragrefine"
version = "0.2.1"
description = "Retriever-agnostic post-retrieval refinement for RAG candidates"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atharva Dharmadhikari" }]
keywords = ["rag", "retrieval", "reranking", "information-retrieval", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Atharva01/ragrefine"
Repository = "https://github.com/Atharva01/ragrefine"
Changelog = "https://github.com/Atharva01/ragrefine/blob/main/CHANGELOG.md"
Issues = "https://github.com/Atharva01/ragrefine/issues"

[project.optional-dependencies]
beir = ["beir==2.2.0"]
rerank = ["sentence-transformers>=6.0.0,<7"]
haystack = ["haystack-ai==2.31.0"]
ragas = ["ragas==0.4.3", "langchain-openai>=0.2.0,<1.0"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["huggingface_hub", "sentence_transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require integration infrastructure",
    "model: tests that require model downloads or inference",
]
