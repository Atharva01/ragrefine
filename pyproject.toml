[project]
name = "ragrefine"
version = "0.1.0"
description = "Retriever-agnostic post-retrieval refinement for RAG candidates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
beir = ["beir==2.2.0"]
rerank = ["sentence-transformers>=6.0.0,<7"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require integration infrastructure",
    "model: tests that require model downloads or inference",
]
