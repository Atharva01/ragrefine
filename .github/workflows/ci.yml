name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Synchronize core and Haystack type-check dependencies
        run: uv sync --locked --extra haystack

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Verify built wheel
        run: |
          uv venv --clear "$RUNNER_TEMP/ragrefine-wheel-env"
          uv pip install --python "$RUNNER_TEMP/ragrefine-wheel-env/bin/python" dist/*.whl
          "$RUNNER_TEMP/ragrefine-wheel-env/bin/python" -c "import ragrefine"

  haystack:
    name: Validate Haystack extra
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Synchronize Haystack and Ragas extras
        run: uv sync --locked --extra haystack --extra ragas

      - name: Test supported Haystack integration
        run: uv run --extra haystack --extra ragas pytest tests/integration

      - name: Verify installed wheel extra
        run: |
          uv build
          uv venv --clear "$RUNNER_TEMP/ragrefine-haystack-wheel-env"
          uv pip install --python "$RUNNER_TEMP/ragrefine-haystack-wheel-env/bin/python" "dist/*.whl[haystack]"
          "$RUNNER_TEMP/ragrefine-haystack-wheel-env/bin/python" - <<'PY'
          from haystack.document_stores.in_memory import InMemoryDocumentStore
          from ragrefine.integrations.haystack import (
              FrozenHaystackFixture,
              build_rag_pipeline,
              demo_documents,
          )

          assert FrozenHaystackFixture().retrieve("Python parser")
          store = InMemoryDocumentStore(bm25_algorithm="BM25L")
          store.write_documents(demo_documents())
          pipeline = build_rag_pipeline(store, top_k=2, profile="b2-l-lexical")
          restored = type(pipeline).loads(pipeline.dumps())
          profile = restored.get_component("refine").to_dict()["init_parameters"][
              "refiner_profile"
          ]
          assert profile == "b2-l-lexical", profile
          print("haystack wheel smoke OK")
          PY
